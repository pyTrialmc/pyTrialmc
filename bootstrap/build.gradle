dependencies {

    implementation "com.google.code.gson:gson:${gson_version}"
}

tasks.register('bootstrapJar', Jar) {
    group = 'build'
    description = 'Package the pyTrial bootstrap (command line entry point)'
    archiveBaseName = 'pytrial-bootstrap'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'net.pytrial.bootstrap.BootstrapMain',
                'Implementation-Title': 'pyTrial Bootstrap',
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'module-info.class'
    }
}

tasks.register('runBootstrap', JavaExec) {
    group = 'pytrial'
    description = 'Run the pyTrial bootstrap; pick the command with -Ppytrial_command=install / launch / info'
    dependsOn ':loader:loaderJar'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.pytrial.bootstrap.BootstrapMain'
    standardInput = System.in
    jvmArgs '-Dstdout.encoding=UTF-8'

    def root = rootProject
    args(root.findProperty('pytrial_command') ?: 'info')
    def gameDir = root.findProperty('pytrial_game_dir')
    if (gameDir) {
        args '--game-dir', gameDir.toString()
    }
    def version = root.findProperty('pytrial_minecraft_version')
    if (version) {
        args '--version', version.toString()
    }

    def loaderJar = project(':loader').tasks.named('loaderJar').flatMap { it.archiveFile }
    systemProperty 'pytrial.loaderJar', loaderJar.get().asFile.absolutePath
}

tasks.register('clientInstallerJar', Jar) {
    group = 'build'
    description = 'Package the pyTrial client installer (window + command line, bundled loader)'
    archiveBaseName = 'pytrial-client-installer'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':loader:loaderJar'

    manifest {
        attributes(
                'Main-Class': 'net.pytrial.bootstrap.ClientInstallerMain',
                'Implementation-Title': 'pyTrial Client Installer',
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'module-info.class'
    }

    def bundledLoader = project(':loader').tasks.named('loaderJar').flatMap { it.archiveFile }
    from(bundledLoader) {
        into 'pytrial/loader'
        rename { 'pytrial-loader.jar' }
    }
}

tasks.named('assemble') {
    dependsOn 'bootstrapJar', 'clientInstallerJar'
}
